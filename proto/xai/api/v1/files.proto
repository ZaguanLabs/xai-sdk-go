syntax = "proto3";

package xai_api;

import "google/protobuf/timestamp.proto";

service Files {
  rpc UploadFile(stream UploadFileChunk) returns (File) {}
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse) {}
  rpc GetFile(GetFileRequest) returns (File) {}
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse) {}
  rpc GetFileContent(GetFileContentRequest) returns (stream FileContentChunk) {}
  rpc RetrieveFileURL(RetrieveFileURLRequest) returns (RetrieveFileURLResponse) {}
  rpc CreatePublicUrl(CreatePublicUrlRequest) returns (CreatePublicUrlResponse) {}
  rpc RevokePublicUrl(RevokePublicUrlRequest) returns (RevokePublicUrlResponse) {}
  rpc RetrieveFile(.xai_api.RetrieveFileRequest) returns (.xai_api.File) {}
  rpc RetrieveFileContent(.xai_api.RetrieveFileContentRequest) returns (stream .xai_api.FileContentChunk) {}
}

message File {
  reserved 6;
  int64 size = 1;
  .google.protobuf.Timestamp created_at = 2;
  optional .google.protobuf.Timestamp expires_at = 3;
  string filename = 4;
  string id = 5;
  optional string public_url = 7;
  optional .google.protobuf.Timestamp public_url_expires_at = 8;
}

message UploadFileChunk {
  oneof chunk {
    .xai_api.UploadFileInit init = 1;
    bytes data = 2;
  }
}

message UploadFileInit {
  string name = 1;
  optional int64 expires_after = 2;
}

message ListFilesRequest {
  int32 limit = 1;
  .xai_api.FilesOrdering order = 2;
  optional string pagination_token = 3;
  optional .xai_api.FilesSortBy sort_by = 4;
  optional string filter = 5;
}

message ListFilesResponse {
  repeated .xai_api.File data = 1;
  optional string pagination_token = 2;
}

message GetFileRequest {
  string file_id = 1;
}

message DeleteFileRequest {
  string file_id = 1;
}

message DeleteFileResponse {
  string id = 1;
  bool deleted = 2;
}

message GetFileContentRequest {
  string file_id = 1;
}

message FileContentChunk {
  bytes data = 1;
}

message RetrieveFileURLRequest {
  string file_id = 1;
}

message RetrieveFileURLResponse {
  string url = 1;
}

message CreatePublicUrlRequest {
  string file_id = 1;
  optional int64 expires_after = 2;
}

message CreatePublicUrlResponse {
  string public_url = 1;
  optional .google.protobuf.Timestamp expires_at = 2;
}

message RevokePublicUrlRequest {
  string file_id = 1;
}

message RevokePublicUrlResponse {
  string file_id = 1;
  bool revoked = 2;
  optional string public_url = 3;
}

enum FilesOrdering {
  option allow_alias = true;
  ASCENDING = 0;
  DESCENDING = 1;
  FILES_ORDERING_ASC = 0;
  FILES_ORDERING_DESC = 1;
}

enum FilesSortBy {
  option allow_alias = true;
  FILES_SORT_BY_CREATED_AT = 0;
  FILES_SORT_BY_FILENAME = 1;
  FILES_SORT_BY_SIZE = 2;
  FILES_SORT_BY_NAME = 1;
}


enum DownloadFormat {
  DOWNLOAD_FORMAT_UNKNOWN = 0;
  DOWNLOAD_FORMAT_ORIGINAL = 1;
  DOWNLOAD_FORMAT_TEXT = 2;
}

message RetrieveFileRequest {
  string file_id = 1;
}

message RetrieveFileContentRequest {
  string file_id = 1;
  optional .xai_api.DownloadFormat format = 2;
}
